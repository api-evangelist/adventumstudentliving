aid: adventumstudentliving
name: Adventum Student Living
description: >-
  Adventum Student Living Private Limited (ASL) is a Mumbai-headquartered study-abroad and student
  accommodation group founded in 2019 by Amit Singh, Anupam Gupta and Sayantan Biswas. It operates a
  family of consumer brands for internationally mobile students: UniAcco (a global purpose-built
  student accommodation marketplace covering the UK, Ireland, the United States, Canada, Australia
  and continental Europe), UniCreds (an education-loan marketplace), UniScholars (study-abroad
  counselling and admissions guidance), UniFlx (short-stay 1-12 week student housing) and
  UniEssential (arrival services such as airport transfers, guarantors, insurance and student bank
  accounts). ASL publishes consumer web properties and an invite-only partner dashboard for property
  owners, but as of this profile it publishes no public developer program, API reference or
  machine-readable contract.
